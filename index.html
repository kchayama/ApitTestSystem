<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>出欠打刻</title>
<style>
  :root {
    --paper: #f4f2ec;
    --ink: #1c2530;
    --muted: #6b7480;
    --line: #d9d5ca;
    --ok: #1d7a57;
    --ng: #b5432c;
    --guide: #e8a33a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body {
    font-family: "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
    max-width: 560px;
    margin: 0 auto;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 2px 6px 4px;
    border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 16px; margin: 0; font-weight: 700; }
  #clock { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }

  .camera {
    position: relative;
    aspect-ratio: 8 / 3;
    background: #0d1117;
    overflow: hidden;
    border-radius: 6px;
  }
  video, #preview { width: 100%; height: 100%; object-fit: cover; display: block; }
  video[hidden], #preview[hidden] { display: none; }
  .guide {
    position: absolute;
    left: 1%; right: 1%; top: 1%; bottom: 1%;
    border: 2px solid var(--guide);
    border-radius: 4px;
    box-shadow: 0 0 0 100vmax rgba(0, 0, 0, 0.4);
    pointer-events: none;
  }

  .status { margin: 0; font-size: 15px; color: var(--muted); min-height: 1.5em; }
  .status[data-kind="err"] { color: var(--ng); }

  button {
    font: inherit;
    font-size: 15px;
    font-weight: 700;
    padding: 9px;
    border: 0;
    border-radius: 6px;
    background: var(--ink);
    color: #fff;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; }
  .actions { display: flex; gap: 6px; }
  .actions button { flex: 1; }
  button:focus-visible, input:focus-visible, summary:focus-visible {
    outline: 3px solid var(--guide);
    outline-offset: 2px;
  }

  #result {
    border-left: 4px solid var(--line);
    padding: 2px 0 2px 10px;
    min-height: 60px;
  }
  #result[data-kind="ok"] { border-color: var(--ok); }
  #result[data-kind="ng"], #result[data-kind="err"] { border-color: var(--ng); }
  #result h2 { font-size: 20px; margin: 0; font-weight: 700; }
  #result-detail {
    white-space: pre-line;
    color: var(--muted);
    margin: 6px 0 0;
    font-size: 15px;
    line-height: 1.7;
    font-variant-numeric: tabular-nums;
  }

  details { border-top: 1px solid var(--line); padding: 6px 6px 0; }
  summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  .manual { display: flex; gap: 6px; margin-top: 6px; }
  input {
    font: inherit;
    font-size: 18px;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    flex: 1;
    min-width: 0;
  }
  .manual button { padding: 12px 18px; }

  /* 本人確認モーダル */
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 10;
  }
  .modal[hidden] { display: none; }
  .sheet {
    background: #fff;
    border-radius: 10px;
    padding: 20px;
    width: 100%;
    max-width: 420px;
  }
  .modal-label { margin: 0; font-size: 14px; color: var(--muted); }
  .modal-name { margin: 6px 0 2px; font-size: 28px; font-weight: 700; }
  .modal-sub { margin: 0; font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .modal-q { margin: 18px 0 14px; font-size: 17px; font-weight: 700; }
  .modal-actions { display: flex; gap: 10px; }
  .modal-actions button { flex: 1; }
  .secondary { background: #fff; color: var(--ink); border: 1px solid var(--line); }
</style>
</head>
<body>

<header>
  <h1>出欠打刻</h1>
  <span id="clock"></span>
</header>

<main style="display:flex;flex-direction:column;gap:6px;">
  <div class="camera">
    <video id="video" autoplay muted playsinline></video>
    <img id="preview" alt="撮影した画像" hidden>
    <div class="guide"></div>
  </div>
  <canvas id="canvas" hidden></canvas>

  <p id="status" class="status">「カメラを起動」を押してください</p>
  <div class="actions">
    <button id="shoot" type="button">カメラを起動</button>
    <button id="read" type="button" disabled>番号取得</button>
  </div>

  <section id="result" data-kind="idle">
    <h2 id="result-title">結果はここに表示されます</h2>
    <p id="result-detail"></p>
  </section>

  <details>
    <summary>手入力で打刻する</summary>
    <div class="manual">
      <input id="manual" inputmode="numeric" autocomplete="off" placeholder="社員番号（6桁）">
      <button id="manual-btn" type="button">打刻</button>
    </div>
  </details>
</main>

<!-- 本人確認モーダル -->
<div id="modal" class="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modal-name">
    <p class="modal-label">社員確認</p>
    <p id="modal-name" class="modal-name"></p>
    <p id="modal-id" class="modal-sub"></p>
    <p class="modal-q">社員証の氏名と一致しますか？</p>
    <div class="modal-actions">
      <button id="modal-no" type="button" class="secondary">いいえ（キャンセル）</button>
      <button id="modal-yes" type="button">はい（記録する）</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
/* ===== 設定（この1か所だけ書き換えてください） ===== */
const CONFIG = {
  // Apps Script のURL（末尾が /exec）
  API_URL: 'https://script.google.com/a/macros/bs-ja.co.jp/s/AKfycbwv_Lf-kjEhmi7lTCj-I6ETQ0tQeifj69pTrO_fKnXXn9BhL0GOWxpQ7oMwvmJ9Pipd/exec',
  // Code.gs の API_TOKEN と同じ値
  API_TOKEN: 'attend2026x',
  ID_DIGITS: 6,          // 社員番号は6桁
  MAX_CANDIDATES: 10,
  REQUEST_TIMEOUT_MS: 50000,
};

/* ===== 共通 ===== */
const $ = (id) => document.getElementById(id);
const video = $('video');
const canvas = $('canvas');
let stream = null;
let workerPromise = null;
let captured = false;   // 撮影画像を表示中か
let busy = false;       // 照合・記録の処理中か
let searchCancel = null; // 検索中の中断関数（検索中のみ値が入る）
let lastReadRuns = [];   // 直近に読み取った数字の並び（表示用）

function tick() {
  $('clock').textContent = new Date().toLocaleTimeString('ja-JP', {
    hour: '2-digit', minute: '2-digit', second: '2-digit',
  });
}
tick();
setInterval(tick, 1000);

function setStatus(msg, kind) {
  const el = $('status');
  el.textContent = msg;
  el.dataset.kind = kind || '';
}

function setResult(kind, title, detail) {
  $('result').dataset.kind = kind;
  $('result-title').textContent = title;
  $('result-detail').textContent = detail || '';
}

/* ===== OCR ===== */
function getWorker() {
  if (!workerPromise) {
    workerPromise = (async () => {
      setStatus('OCRエンジンを準備しています（初回のみ時間がかかります）');
      const w = await Tesseract.createWorker('eng');
      await w.setParameters({
        tessedit_pageseg_mode: '6',              // 1つのまとまりとして読む
        tessedit_char_whitelist: '0123456789',   // 数字だけを認識する
      });
      return w;
    })();
  }
  return workerPromise;
}

// 枠の内側の読み取り範囲をグレースケールにして canvas に描画する
function prepareFrame() {
  const vw = video.videoWidth;
  const vh = video.videoHeight;
  if (!vw || !vh) throw new Error('カメラの準備ができていません');

  // 画面上の映像表示欄（object-fit: cover で切り取られている）
  const box = video.getBoundingClientRect();
  const cw = box.width;
  const ch = box.height;
  const s = Math.max(cw / vw, ch / vh);          // cover の拡大率
  const ox = (cw - vw * s) / 2;                  // 表示欄に対する映像の左端のずれ
  const oy = (ch - vh * s) / 2;                  // 表示欄に対する映像の上端のずれ

  // 枠（.guide：全方向1%の余白の内側）の位置を、映像の座標に変換する
  const gx = cw * 0.01, gy = ch * 0.01, gw = cw * 0.98, gh = ch * 0.98;
  const sx = Math.max(0, (gx - ox) / s);
  const sy = Math.max(0, (gy - oy) / s);
  const sw = Math.min(vw - sx, gw / s);
  const sh = Math.min(vh - sy, gh / s);

  // 縦横比を保って、横640pxに合わせる
  const W = 640;
  const H = Math.round((W * sh) / sw);
  canvas.width = W;
  canvas.height = H;

  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, W, H);

  const img = ctx.getImageData(0, 0, W, H);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const g = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
    d[i] = g;
    d[i + 1] = g;
    d[i + 2] = g;
  }
  binarize(d);
  ctx.putImageData(img, 0, 0);
}

// 大津の方法で、明るさの境目を自動で決めて白黒にする
function binarize(d) {
  const hist = new Array(256).fill(0);
  for (let i = 0; i < d.length; i += 4) hist[d[i]]++;
  const total = d.length / 4;
  let sumAll = 0;
  for (let t = 0; t < 256; t++) sumAll += t * hist[t];

  let wB = 0, sumB = 0, best = -1, threshold = 128;
  for (let t = 0; t < 256; t++) {
    wB += hist[t];
    if (wB === 0) continue;
    const wF = total - wB;
    if (wF === 0) break;
    sumB += t * hist[t];
    const mB = sumB / wB;
    const mF = (sumAll - sumB) / wF;
    const between = wB * wF * (mB - mF) * (mB - mF);
    if (between > best) {
      best = between;
      threshold = t;
    }
  }

  for (let i = 0; i < d.length; i += 4) {
    const v = d[i] > threshold ? 255 : 0;
    d[i] = v;
    d[i + 1] = v;
    d[i + 2] = v;
  }
}

// 撮影した画面全体を、表示用の画像（data URL）にする
function snapshotFrame() {
  const shot = document.createElement('canvas');
  const scale = Math.min(1, 640 / video.videoWidth);
  shot.width = Math.round(video.videoWidth * scale);
  shot.height = Math.round(video.videoHeight * scale);
  shot.getContext('2d').drawImage(video, 0, 0, shot.width, shot.height);
  return shot.toDataURL('image/jpeg', 0.85);
}

function extractCandidates(text) {
  const norm = text.replace(/[OoQD]/g, '0').replace(/[IilL|]/g, '1');
  const runs = norm.match(/\d+(?:[\s-]+\d+)*/g) || [];
  lastReadRuns = runs.map((r) => r.replace(/\D/g, '')).filter(Boolean);
  const set = new Set();
  for (const digits of lastReadRuns) {
    if (digits.length === CONFIG.ID_DIGITS) {
      set.add(digits);
    }
  }
  return Array.from(set).slice(0, CONFIG.MAX_CANDIDATES);
}

/* ===== サーバー通信（<script>方式） ===== */
function callApi(params, abortable) {
  return new Promise(function (resolve, reject) {
    if (CONFIG.API_URL.indexOf('ここに') !== -1) {
      reject(new Error('API_URLが未設定です。index.htmlのCONFIGを確認してください'));
      return;
    }
    const cb = 'attendanceCb_' + Date.now() + '_' + Math.floor(Math.random() * 1000000);
    const script = document.createElement('script');
    let timer = null;

    function cleanup() {
      clearTimeout(timer);
      delete window[cb];
      script.remove();
      if (abortable) searchCancel = null;
    }

    timer = setTimeout(function () {
      cleanup();
      reject(new Error('タイムアウトしました。電波状況を確認してください'));
    }, CONFIG.REQUEST_TIMEOUT_MS);

    window[cb] = function (data) {
      cleanup();
      resolve(data);
    };
    script.onerror = function () {
      cleanup();
      reject(new Error('サーバーに接続できませんでした（接続先: ' + CONFIG.API_URL.trim().slice(0, 45) + '…）'));
    };

    if (abortable) {
      searchCancel = function () {
        clearTimeout(timer);
        script.remove();
        window[cb] = function () {}; // 中断後に届いた応答は無視する
        searchCancel = null;
        reject(new Error('ABORTED'));
      };
    }

    const query = new URLSearchParams(Object.assign({ token: CONFIG.API_TOKEN, callback: cb }, params));
    const base = CONFIG.API_URL.trim();
    script.src = base + '?' + query.toString();
    document.head.appendChild(script);
  });
}

function errorMessage(code) {
  if (code === 'unauthorized') return 'トークンが一致しません。設定を確認してください';
  if (code === 'busy') return 'サーバーが混み合っています。しばらくしてから再度お試しください';
  if (code === 'not_found') return '社員マスタに該当する社員番号がありません';
  return '処理に失敗しました（' + (code || '不明') + '）';
}

/* ===== 本人確認モーダル ===== */
// 「はい」なら true、「いいえ」なら false を返す
function askConfirm(emp) {
  return new Promise(function (resolve) {
    $('modal-name').textContent = emp.name;
    $('modal-id').textContent = '社員番号 ' + emp.id;
    $('modal').hidden = false;
    $('modal-yes').onclick = function () {
      $('modal').hidden = true;
      resolve(true);
    };
    $('modal-no').onclick = function () {
      $('modal').hidden = true;
      resolve(false);
    };
  });
}

/* ===== 撮影・手入力の共通入口 ===== */
// 処理中に別の撮影・手入力が来ても二重に動かさない
async function verifyAndRecord(candidates) {
  if (busy) {
    return;
  }
  busy = true;
  try {
    await runVerification(candidates);
  } finally {
    busy = false;
  }
}

/* ===== 照合 → 本人確認 → 記録 / キャンセル ===== */
async function runVerification(candidates) {
  if (candidates.length === 0) {
    const read = lastReadRuns.length ? lastReadRuns.join(' / ') : '（数字なし）';
    setResult(
      'ng',
      '社員番号は' + CONFIG.ID_DIGITS + '桁です',
      '読み取り値: ' + read + '\n6桁の社員番号を枠に合わせて、撮り直してください'
    );
    return;
  }

  // 1. 社員マスタを検索（記録はしない）
  setStatus('社員番号を照合しています…');
  let found;
  try {
    found = await callApi({ action: 'lookup', candidates: JSON.stringify(candidates) }, true);
  } catch (err) {
    if (err.message === 'ABORTED') {
      setResult('ng', '検索を中断しました', '入力内容が変わったため、照合を取りやめました。もう一度お試しください');
      return;
    }
    setResult('err', '照合できませんでした', err.message);
    return;
  }
  if (!found.ok) {
    setResult('err', '照合できませんでした', errorMessage(found.error));
    return;
  }
  if (!found.found) {
    setResult(
      'ng',
      '一致する社員番号がありません',
      '読み取り値: ' + candidates.join(' / ') + '\n撮り直してください'
    );
    return;
  }

  // 2. 本人確認（はい／いいえ）
  setStatus('本人確認をお願いします');
  const same = await askConfirm({ id: found.id, name: found.name });

  // 3-a. はい → 出勤を記録、同じ日の2回目以降は同じ行の日時を上書きして退勤
  if (same) {
    setStatus('記録しています…');
    const rec = await callApi({ action: 'confirm', id: found.id });
    if (!rec.ok) {
      setResult('err', '打刻できませんでした', errorMessage(rec.error));
      return;
    }
    setResult('ok', rec.type + 'を記録しました', rec.name + '\n社員番号 ' + rec.id + '\n' + rec.time);
    return;
  }

  // 3-b. いいえ → 何も記録せず、キャンセルとして表示
  setResult('ng', 'キャンセルしました', found.name + '\n出勤・退勤は記録していません');
}

/* ===== カメラ ===== */
async function startCamera() {
  if (stream) return;
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
    audio: false,
  });
  video.srcObject = stream;
  await video.play();
}

function cameraError(err) {
  if (err.name === 'NotAllowedError') return 'カメラの使用が許可されていません。ブラウザの設定で許可してください';
  if (err.name === 'NotFoundError') return 'カメラが見つかりません';
  return 'カメラを起動できませんでした（' + err.message + '）';
}

function showLive() {
  $('preview').hidden = true;
  video.hidden = false;
}

function showPreview(src) {
  $('preview').src = src;
  $('preview').hidden = false;
  video.hidden = true;
}

/* ===== 撮影ボタン ===== */
// 1回目：カメラを起動 / 2回目：撮影して読み取り / 撮影後：撮り直す
async function onShoot() {
  if (!stream) {
    try {
      setStatus('カメラを起動しています…');
      await startCamera();
      $('shoot').textContent = '撮影する';
      setStatus('社員証を枠に合わせて「撮影する」を押してください');
    } catch (err) {
      setStatus(cameraError(err), 'err');
    }
    return;
  }

  if (captured) {
    captured = false;
    showLive();
    $('shoot').textContent = '撮影する';
    $('read').disabled = true;
    setStatus('社員証を枠に合わせて「撮影する」を押してください');
    return;
  }

  if (busy) {
    setStatus('前の処理が終わるまでお待ちください');
    return;
  }

  try {
    prepareFrame();                  // 読み取り範囲を canvas に保持する
    showPreview(snapshotFrame());    // 撮影した画像を画面に残す
    captured = true;
    $('shoot').textContent = '撮り直す';
    $('read').disabled = false;
    setStatus('「番号取得」を押すと、この画像から社員番号を読み取ります');
  } catch (err) {
    setResult('err', '撮影できませんでした', err.message || String(err));
  }
}

/* ===== 番号取得ボタン ===== */
// 撮影済みの画像（canvas）から社員番号を読み取る
async function onRead() {
  if (!captured) return;
  if (busy) {
    setStatus('前の処理が終わるまでお待ちください');
    return;
  }
  try {
    const ocr = await getWorker();
    setStatus('文字を読み取っています…');
    const result = await ocr.recognize(canvas);
    await verifyAndRecord(extractCandidates(result.data.text));
  } catch (err) {
    setResult('err', '読み取りに失敗しました', err.message || String(err));
  }
  setStatus('撮り直す場合は「撮り直す」を押してください');
}

$('shoot').addEventListener('click', onShoot);
$('read').addEventListener('click', onRead);

/* ===== 手入力 ===== */
$('manual-btn').addEventListener('click', async function () {
  const raw = $('manual').value.trim();
  const digits = raw.replace(/\D/g, '');
  if (digits.length !== CONFIG.ID_DIGITS) {
    setResult(
      'ng',
      '社員番号は' + CONFIG.ID_DIGITS + '桁です',
      '入力値: ' + (raw || '（空欄）') + '\n6桁の社員番号を入力してください'
    );
    return;
  }
  if (busy) {
    setStatus('前の処理が終わるまでお待ちください');
    return;
  }
  setStatus('手入力の社員番号を照合しています…');
  try {
    await verifyAndRecord([digits]);
    // 検索中に入力が変わった場合は、新しい入力を残す
    if ($('manual').value.trim() === raw) {
      $('manual').value = '';
    }
  } catch (err) {
    setResult('err', '打刻できませんでした', err.message);
  }
});

// 検索中に手入力の内容が変わったら、検索を中断する
$('manual').addEventListener('input', function () {
  if (searchCancel) {
    searchCancel();
    setStatus('中断されました');
  }
});
</script>
</body>
</html>
